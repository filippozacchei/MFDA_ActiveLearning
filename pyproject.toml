[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-active-mcmc"
version = "0.1.0"
description = "MCMC-guided active learning for GP surrogate likelihoods"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gp_active_mcmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --tb=short"
filterwarnings = [
  "ignore:Assigning the 'data' attribute is an inherently unsafe operation.*:DeprecationWarning:paramz\\.",
]

[tool.black]
line-length = 88
target-version = ["py310"]

