[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gp_active_mcmc"
version = "0.1.0"
description = "Active/adaptive multi-fidelity MCMC with GP surrogates"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Filippo Zacchei" }]
dependencies = [
  "numpy==1.26.4",
  "scipy==1.12.0",
  "scikit-learn==1.7.2",
  "tinyda==0.9.21",
  "ray==2.53.0",
  "GPy==1.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gp_active_mcmc*"]

# Modern dependency groups (recommended tooling path: uv/pip>=24.1)
[dependency-groups]
test = [
  "pytest>=9",
  "pytest-cov",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-section-index>=0.3",
  "mkdocs-autorefs",
  "mkdocs-jupyter",
  "pymdown-extensions",
]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
  "pre-commit",
  "ruff",
  "mypy",
  "nox",
]

[tool.pytest.ini_options]
minversion = "9"
testpaths = ["tests"]
log_level = "INFO"
xfail_strict = true
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = [
  "tinyDA",
  "sklearn.*",
  "GPy",
]
ignore_missing_imports = true
