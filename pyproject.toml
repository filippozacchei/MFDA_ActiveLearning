[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gp_active_mcmc"
version = "0.1.0"
description = "Active/adaptive multi-fidelity MCMC with GP surrogates"
readme = "README.md"
requires-python = "==3.10.19"
license = {file = "LICENSE"}
authors = [{name = "Filippo Zacchei"}]
dependencies = [
  "numpy==1.26.4",
  "scipy==1.12.0",
  "scikit-learn==1.7.2",
  "tinyda==0.9.21",
  "ray==2.53.0",
  "GPy==1.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gp_active_mcmc*"]

[project.optional-dependencies]
# Documentation build (MkDocs).
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-section-index>=0.3",
]

# Example dependencies.
# NOTE: fenics-dolfinx and MPI stacks are typically installed via conda-forge.
examples = [
  "pyvista",
  "gmsh==4.15.0",
  "python-gmsh==4.15.0",
]

# Developer tooling.
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "black>=24.0",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --tb=short"
filterwarnings = [
  "ignore:Assigning the 'data' attribute is an inherently unsafe operation.*:DeprecationWarning:paramz\\.",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false


