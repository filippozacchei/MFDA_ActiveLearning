[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-active-mcmc"
version = "0.1.0"
description = "MCMC-guided active learning for GP surrogate likelihoods"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "GPy>=1.13.2",
  "pytest>=7.4",
  "tinyda"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
